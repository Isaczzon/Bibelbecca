<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- BibelBecca – flik-ikon efter kanalens profilbild:
       vit cirkel, blont hår bakom en svart bok märkt "BIBELN" -->
  <circle cx="32" cy="32" r="31" fill="#FFFFFF"/>
  <circle cx="32" cy="32" r="30.5" fill="none" stroke="#D8D8D8" stroke-width="1"/>
  <!-- Hår (blont, mittbena) -->
  <path d="M32 12 C20 12 15 22 15 30 L18 32 C18 24 22 16 32 16 C42 16 46 24 46 32 L49 30 C49 22 44 12 32 12 Z" fill="#E8C96A"/>
  <ellipse cx="32" cy="19" rx="13" ry="7" fill="#E8C96A"/>
  <path d="M32 13 L32 22" stroke="#C9A53E" stroke-width="1.2"/>
  <!-- Händer som håller boken -->
  <ellipse cx="13" cy="40" rx="4" ry="5" fill="#F0C9A8"/>
  <ellipse cx="51" cy="40" rx="4" ry="5" fill="#F0C9A8"/>
  <!-- Uppslagen svart bok som döljer ansiktet -->
  <path d="M32 26 C25 21 16 22 12 25 L15 50 C20 47 27 47 32 51 C37 47 44 47 49 50 L52 25 C48 22 39 21 32 26 Z" fill="#100C08"/>
  <path d="M32 26 L32 51" stroke="#2e2a24" stroke-width="1.6"/>
  <!-- Titel "BIBELN" i guld på högersidan -->
  <text x="36" y="38" font-family="Georgia, serif" font-size="6.5" font-weight="bold" fill="#E5C04B" transform="rotate(8 36 38)">BIBELN</text>
</svg>
